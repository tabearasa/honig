<!-- Script for the Gallery -->
<script>
  const imageContainer = document.getElementById('imageGallery');

  // Get Number of Images
  const totalImages = 3

  for (let i = 1; i <= totalImages; i++) {
    const img = document.createElement('img');
    img.src = 'img/gallery/' + i + '.JPG';
    img.alt = 'Image ' + i;
    img.className = 'img-fluid rounded mx-auto d-block mt-4 mb-4';
    img.style.width = '95%';
    imageContainer.appendChild(img);
  }
</script>

<!-- Script to load the Vimeo embed only after user consent (click) -->
<script>
  function loadVimeoVideo() {
    const placeholder = document.getElementById('videoPlaceholder');
    placeholder.outerHTML = '<div style="padding:56.25% 0 0 0;position:relative;"><iframe src="https://player.vimeo.com/video/872668567?badge=0&autopause=0&quality_selector=1&progress_bar=1&player_id=0&app_id=58479" frameborder="0" allow="autoplay; fullscreen; picture-in-picture" style="position:absolute;top:0;left:0;width:100%;height:100%;" title="Honig"></iframe></div>';
    const vimeoScript = document.createElement('script');
    vimeoScript.src = 'https://player.vimeo.com/api/player.js';
    document.body.appendChild(vimeoScript);
  }
</script>
