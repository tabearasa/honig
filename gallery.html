<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Honig</title>
  <link href="css/vendor/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/custom.css">
  <link rel="icon" href="img/icons/honig.png">
</head>
<body>

<!-- Navigation -->
<nav class="navbar bg-light text-secondary shadow-lg">
  <div class="container-fluid">
    <a class="navbar-brand text-secondary" href="index.html">Honig</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse text-secondary" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link text-secondary" href="products.html">Produkte</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-secondary" href="gallery.html">Galerie</a>
        </li>
      </ul>
  </div>
</nav>

<!-- Gallery -->
<div id="imageGallery" class="mt-4 mb-4"></div>

<!-- Video (click-to-load: nothing is requested from Vimeo until the visitor clicks) -->
<div class="mx-auto mb-4" style="width: 95%;">
  <div id="videoPlaceholder" onclick="loadVimeoVideo()" style="padding:56.25% 0 0 0;position:relative;background-image:url('img/gallery/2.JPG');background-size:cover;background-position:center;cursor:pointer;border-radius:0.375rem;overflow:hidden;">
    <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:70px;height:70px;background:rgba(0,0,0,0.6);border-radius:50%;display:flex;align-items:center;justify-content:center;">
      <div style="width:0;height:0;border-top:14px solid transparent;border-bottom:14px solid transparent;border-left:22px solid white;margin-left:6px;"></div>
    </div>
    <div style="position:absolute;bottom:0;left:0;right:0;color:white;background:rgba(0,0,0,0.6);padding:6px;font-size:0.85rem;text-align:center;">
      Video laden (lädt Inhalte von Vimeo &ndash; siehe <a href="datenschutz.html" style="color:white;">Datenschutzerkl&auml;rung</a>)
    </div>
  </div>
</div>

<!-- Space -->
<div class="mb-5 mt-1">

<!-- Footer -->
<footer class="bg-light mt-auto py-2 text-center fixed-bottom">
    <div class="container-fluid px-4">
        <a href="https://github.com/tabearasa" class="text-secondary" style="text-decoration: none">
            <i class="fab fa-github fa-1.5x align-middle"></i>
            <span class="align-middle">tabearasa</span>
    </div>
</footer>

<!-- Bootstrap JavaScript -->
<script src="js/vendor/popper.min.js"></script>
<script src="js/vendor/bootstrap.min.js"></script>

<!-- Script for the Gallery -->
<script>
  const imageContainer = document.getElementById('imageGallery');

  // Get Number of Images
  const totalImages = 3

  for (let i = 1; i <= totalImages; i++) {
    const img = document.createElement('img');
    img.src = 'img/gallery/' + i + '.JPG';
    img.alt = 'Image ' + i;
    img.className = 'img-fluid rounded mx-auto d-block mt-4 mb-4';
    img.style.width = '95%';
    imageContainer.appendChild(img);
  }
</script>

<!-- Script to load the Vimeo embed only after user consent (click) -->
<script>
  function loadVimeoVideo() {
    const placeholder = document.getElementById('videoPlaceholder');
    placeholder.outerHTML = '<div style="padding:56.25% 0 0 0;position:relative;"><iframe src="https://player.vimeo.com/video/872668567?badge=0&autopause=0&quality_selector=1&progress_bar=1&player_id=0&app_id=58479" frameborder="0" allow="autoplay; fullscreen; picture-in-picture" style="position:absolute;top:0;left:0;width:100%;height:100%;" title="Honig"></iframe></div>';
    const vimeoScript = document.createElement('script');
    vimeoScript.src = 'https://player.vimeo.com/api/player.js';
    document.body.appendChild(vimeoScript);
  }
</script>

</body>
</html>
